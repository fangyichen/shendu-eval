[project]
name = "shendu-eval"
version = "0.1.0"
description = "Shèndú (慎独): an integrity-under-no-observation eval for LLMs, built on Inspect AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.50",
    "pydantic>=2.5",
    "pandas>=2.0",
    # required by Inspect's openai-api provider (used for local LM Studio models)
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shendu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
